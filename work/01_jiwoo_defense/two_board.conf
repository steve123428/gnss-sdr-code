[GNSS-SDR]

############################################################
# GLOBAL OPTIONS
############################################################
GNSS-SDR.internal_fs_sps=4000000


############################################################
# SIGNAL SOURCE CONFIG
############################################################
SignalSource.implementation=UHD_Signal_Source
SignalSource.item_type=gr_complex
SignalSource.device_address=192.168.40.2
SignalSource.sampling_frequency=4000000

SignalSource.clock_source=external
# SignalSource.time_source=external
# SignalSource.buffer_size = 262144  # Increase buffer size
# SignalSource.sample_rate = 2.048e6  # Adjust sample rate

SignalSource.RF_channels=2
SignalSource.subdevice=A:0 B:0

SignalSource.freq0=1575420000
SignalSource.gain0=70

SignalSource.freq1=1575420000
SignalSource.gain1=70


############################################################
# SIGNAL CONDITIONERS (RF0 & RF1)
############################################################
SignalConditioner0.implementation=Signal_Conditioner
InputFilter0.implementation=Pass_Through
InputFilter0.item_type=gr_complex
Resampler0.implementation=Pass_Through

SignalConditioner1.implementation=Signal_Conditioner
InputFilter1.implementation=Pass_Through
InputFilter1.item_type=gr_complex
Resampler1.implementation=Pass_Through


############################################################
# CHANNELS CONFIG
############################################################
Channels_1C.count=4
Channels.in_acquisition=1

Channel0.signal=1C
Channel0.satellite=4
Channel0.RF_channel_ID=0

Channel1.signal=1C
Channel1.satellite=4
Channel1.RF_channel_ID=1

Channel2.signal=1C
Channel2.satellite=9
Channel2.RF_channel_ID=0

Channel3.signal=1C
Channel3.satellite=9
Channel3.RF_channel_ID=1


############################################################
# ACQUISITION (single block for all 32 channels)
############################################################
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.doppler_max=5000
Acquisition_1C.doppler_step=10
Acquisition_1C.dump=false
Acquisition_1C.dump_mat=true
Acquisition_1C.dump_filename=./log/acq/acq_dump.dat
Acquisition_1C.dump_channel=0


############################################################
# TRACKING (공통 1C tracking)
############################################################
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.pll_bw_hz=40.0
Tracking_1C.dll_bw_hz=4.0
Tracking_1C.dump=true
Tracking_1C.dump_mat=true
Tracking_1C.dump_filename=./log/tracking/tracking_ch
#Tracking_1C.extend_correlation_symbols=1
Tracking_1C.max_lock_fail=400000


############################################################
# TELEMETRY DECODER
############################################################
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_1C.dump=false
TelemetryDecoder_1C.dump_mat=true
TelemetryDecoder_1C.dump_filename=./log/Telemetry/1C        


############################################################
# OBSERVABLES
############################################################
Observables.implementation=Hybrid_Observables
Observables.dump=false
Observables.dump_mat=true
Observables.dump_filename=./log/Observables/Observables


############################################################
# PVT
############################################################
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.flag_rtcm_server=true
PVT.flag_rtcm_tty_port=false
PVT.rtcm_dump_devname=/dev/pts/1
PVT.rtcm_tcp_port=2101
PVT.rtcm_MT1019_rate_ms=5000
PVT.rtcm_MT1077_rate_ms=1000
PVT.rinex_version=3
PVT.flag_nmea_tty_port=true
PVT.output_enabled=false
PVT.output_format=pipe
PVT.output_filename=/tmp/gnss_sdr_pvt
PVT.enable_rx_clock_correction=true
PVT.dump=false
#PVT.Dump_Filename=./log/PVT/pvt

############################################################
# MONITOR CONFIG
############################################################
Monitor.enable_monitor=true
Monitor.decimator_factor=50
Monitor.client_addresses=127.0.0.1
Monitor.udp_port=1234                                                         